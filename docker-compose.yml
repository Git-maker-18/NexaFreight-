version: '3.8'

services:
  # 1. Database Tier
  db:
    image: postgres:15-alpine
    container_name: nexa-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexafreight}
    volumes:
      - nexa_db_data:/var/lib/postgresql/data
    networks:
      - nexa_internal

  # 2. Backend Tier (FastAPI)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexa-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000" # Expose for direct SSE transport
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nexafreight}
    networks:
      - nexa_internal

  # 3. Frontend Tier (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexa-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_NEXA_API_URL=http://localhost:8000 # Client-side direct connection
      - INTERNAL_BACKEND_URL=http://backend:8000 # Server-side proxy connection
      - ENABLE_UMAMI=true
    networks:
      - nexa_internal
      - umami_default

networks:
  nexa_internal:
    driver: bridge
  umami_default:
    external: true

volumes:
  nexa_db_data:

# CasaOS Metadata
x-casaos:
  architectures:
    - amd64
    - arm64
  main: "frontend"
  author: "NexaFreight"
  category: "Web"
  description: "NexaFreight Global Supply Chain Intelligence Platform"
  title:
    en_US: "NexaFreight"
